name: Release

# Runs when you push a tag like v1.0.0
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Resolve version from tag
        id: ver
        run: echo "name=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Decode release keystore (optional)
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "RESONANCE_KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
            echo "Release keystore found - APK will be signed with it."
          else
            echo "No KEYSTORE_BASE64 secret - APK will be signed with the debug key."
          fi

      - name: Check release keystore
        if: ${{ env.RESONANCE_KEYSTORE_FILE != '' }}
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          f="$RUNNER_TEMP/release.jks"
          echo "Keystore size: $(stat -c %s "$f") bytes, sha256: $(sha256sum "$f" | cut -d' ' -f1)"
          if ! keytool -list -keystore "$f" -storepass "$KEYSTORE_PASSWORD" >/dev/null 2>&1; then
            echo "::error::KEYSTORE_PASSWORD does not open the keystore (or KEYSTORE_BASE64 was damaged when pasted). Compare the sha256 above with 'sha256sum release.jks' in Termux."
            exit 1
          fi
          if ! keytool -list -keystore "$f" -storepass "$KEYSTORE_PASSWORD" -alias "$KEY_ALIAS" >/dev/null 2>&1; then
            echo "::error::Alias in KEY_ALIAS was not found in the keystore. It must be exactly what you used after -alias."
            exit 1
          fi
          if [ "$KEY_PASSWORD" != "$KEYSTORE_PASSWORD" ]; then
            echo "::error::KEY_PASSWORD differs from KEYSTORE_PASSWORD. Keystores made by recent Java versions need them to be identical."
            exit 1
          fi
          echo "Keystore, alias and passwords are consistent."

      - name: Unit tests
        run: ./gradlew testDebugUnitTest

      - name: Build release APK
        env:
          APP_VERSION_NAME: ${{ steps.ver.outputs.name }}
          APP_VERSION_CODE: ${{ github.run_number }}
          RESONANCE_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          RESONANCE_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          RESONANCE_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew assembleRelease

      - name: Rename APK
        run: mv app/build/outputs/apk/release/*.apk "Resonance-${GITHUB_REF_NAME}.apk"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: Resonance-${{ github.ref_name }}.apk
          generate_release_notes: true
